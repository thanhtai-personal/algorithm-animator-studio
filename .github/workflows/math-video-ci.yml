name: Math Video Studio CI

on:
  push:
    branches:
      - feature/math-video-studio-v1
    paths:
      - "src/features/math-video/**"
      - "src/pages/MathVideoStudio.tsx"
      - "src/App.tsx"
      - "src/components/appNavigation.ts"
      - "src/lib/menuFeatureSettings.ts"
      - "src/features/preset-video/presetVideoRegistry.ts"
      - "src/features/remotion-video/remotion/Root.tsx"
      - ".github/workflows/math-video-ci.yml"
  pull_request:
    paths:
      - "src/features/math-video/**"
      - "src/pages/MathVideoStudio.tsx"
      - "src/App.tsx"
      - "src/components/appNavigation.ts"
      - "src/lib/menuFeatureSettings.ts"
      - "src/features/preset-video/presetVideoRegistry.ts"
      - "src/features/remotion-video/remotion/Root.tsx"
      - ".github/workflows/math-video-ci.yml"

jobs:
  verify:
    name: Math Studio tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install project dependencies
        run: npm ci
      - name: Math geometry/timeline tests
        run: npx vitest run src/features/math-video/__tests__/mathGeometry.test.ts
      - name: App build
        run: npm run build
      - name: Render representative math frames
        run: |
          npx remotion still src/features/remotion-video/remotion/index.ts MathSinCosV1 /tmp/math-f000.png --frame=0
          npx remotion still src/features/remotion-video/remotion/index.ts MathSinCosV1 /tmp/math-f250.png --frame=250
          npx remotion still src/features/remotion-video/remotion/index.ts MathSinCosV1 /tmp/math-f850.png --frame=850
          npx remotion still src/features/remotion-video/remotion/index.ts MathSinCosV1 /tmp/math-f3500.png --frame=3500
      - name: Render 40s MP4 preview
        run: npx remotion render src/features/remotion-video/remotion/index.ts MathSinCosV1 /tmp/math-video-first40.mp4 --frames=0-999 --codec=h264 --concurrency=2
      - name: Publish generated preview
        uses: actions/upload-artifact@v4
        with:
          name: math-video-v1-preview-40s
          path: |
            /tmp/math-f000.png
            /tmp/math-f250.png
            /tmp/math-f850.png
            /tmp/math-f3500.png
            /tmp/math-video-first40.mp4
          retention-days: 5
