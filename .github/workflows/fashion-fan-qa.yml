name: Fashion Fan QA
on:
  pull_request:
    paths:
      - "src/features/preset-video/presets/fashion-claw/**"
      - "src/features/preset-video/components/PresetVideoPreviewEditor.tsx"
      - "scripts/verify-fashion-fan-render.mjs"
      - ".github/workflows/fashion-fan-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build Vite
        run: npm run build
      - name: Test Fashion Fan modules
        run: npm test -- src/features/preset-video/presets/fashion-claw
      - name: Verify 296-frame Remotion MP4
        run: node scripts/verify-fashion-fan-render.mjs
      - name: Run full Vitest suite (including unrelated repository tests)
        run: npm test
      - name: Save MP4 and ffprobe report for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashion-fan-t07-preview
          path: |
            generated-videos/fashion-fan-t07-qa.mp4
            generated-videos/fashion-fan-t07-report.json
          if-no-files-found: warn
          retention-days: 3
