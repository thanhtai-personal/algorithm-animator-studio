name: Math Video 36-scene Visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/math-video-studio-v1
    paths:
      - ".github/workflows/math-video-visual-qa.yml"
      - "scripts/math-video-v1-visual-stills.mjs"

permissions:
  contents: read

jobs:
  render-scene-gallery:
    name: Render 36 reference-beat middle frames
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Source manifest preflight
        run: node scripts/math-video-v1-release-qa.mjs --manifest-only
      - name: Frontend build
        run: npm run build
      - name: Render 36 beat midpoint frames from current code
        run: node scripts/math-video-v1-visual-stills.mjs generated-videos/math-v1-qa-stills
      - name: Upload visual-review candidates
        uses: actions/upload-artifact@v4
        with:
          name: math-video-v1-36-scene-gallery
          path: generated-videos/math-v1-qa-stills/
          retention-days: 7
          if-no-files-found: error
