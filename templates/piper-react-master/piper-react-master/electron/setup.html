<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đang chuẩn bị Kata Studio</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 0%, rgba(139, 92, 246, .25), transparent 34%), #070717; color: #f8fafc; }
      main { width: min(440px, calc(100vw - 48px)); border: 1px solid rgba(148, 163, 184, .24); border-radius: 24px; padding: 28px; background: rgba(15, 23, 42, .82); box-shadow: 0 24px 80px rgba(0,0,0,.38); }
      .spinner { width: 34px; height: 34px; border-radius: 999px; border: 3px solid rgba(148, 163, 184, .35); border-top-color: #a78bfa; animation: spin 1s linear infinite; margin-bottom: 18px; }
      h1 { margin: 0 0 10px; font-size: 20px; }
      p { margin: 0; color: #cbd5e1; line-height: 1.55; }
      .log { margin-top: 18px; padding: 14px; border-radius: 16px; background: rgba(15, 23, 42, .88); color: #dbeafe; font-size: 13px; min-height: 56px; white-space: pre-wrap; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner"></div>
      <h1>Đang chuẩn bị môi trường local</h1>
      <p>Kata Studio sẽ tự kiểm tra và cài những phần còn thiếu như Piper, model giọng đọc và FFmpeg.</p>
      <div id="log" class="log">Đang khởi động...</div>
    </main>
    <script>
      const { ipcRenderer } = require("electron");
      const log = document.getElementById("log");
      ipcRenderer.on("runtime-setup-status", (_event, payload) => {
        log.textContent = payload?.message || "Đang xử lý...";
      });
    </script>
  </body>
</html>
